name: Release Build
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release Tag"
        required: true
      publish:
        description: "Enter y to skip publishing (blank publishes APKs and AAB)"
        required: false
      play:
        description: "Enter y to skip Play bundle (blank builds signed AAB)"
        required: false
permissions:
  contents: write
jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version=$(sed -n 's/^VERSION_NAME=//p' nb4a.properties | tr -d '\r')
          test "$RELEASE_TAG" = "v$version"
      - name: Golang Status
        run: find buildScript libcore/*.sh | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            app/libs/libcore.aar
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}
      - name: Install Golang
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib core
      - name: Check native ABI coverage
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('app/libs/libcore.aar') as archive:
              names = set(archive.namelist())
              for abi in ('armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'):
                  assert f'jni/{abi}/libgojni.so' in names, f'Missing native library: {abi}'
          PY
  build:
    name: Build OSS APK
    runs-on: ubuntu-latest
    needs:
      - libcore
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Golang Status
        run: find buildScript libcore/*.sh | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        uses: actions/cache@v4
        with:
          path: |
            app/libs/libcore.aar
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-oss-${{ hashFiles('**/*.gradle.kts') }}
      - name: Gradle Build
        env:
          BUILD_PLUGIN: none
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          echo "${{ secrets.RELEASE_KEYSTORE_B64 }}" | base64 -d > release.keystore
          ./run init action gradle
          ./gradlew app:assembleOssRelease
          APK=$(find app/build/outputs/apk -name '*arm64-v8a*.apk')
          APK=$(dirname $APK)
          echo "APK=$APK" >> $GITHUB_ENV
      - name: Verify APKs are signed
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          for apk in "$APK"/*.apk; do
            echo "verifying $apk"
            "$apksigner" verify "$apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: APKs
          path: ${{ env.APK }}
  publish:
    name: Publish Release
    if: always() && github.event.inputs.publish != 'y' && needs.build.result == 'success' && (needs.play.result == 'success' || needs.play.result == 'skipped')
    runs-on: ubuntu-latest
    needs: [build, play]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Donwload Artifacts
        uses: actions/download-artifact@v4
        with:
          name: APKs
          path: artifacts
      - name: Download Play Bundle
        if: needs.play.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: AAB
          path: artifacts
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir release-assets
          find artifacts -name "*.apk" -exec cp {} release-assets \;
          find artifacts -name "*.aab" -exec cp {} release-assets \;
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            # Retry an incomplete publication without deleting the release,
            # moving its tag, or replacing previously published binaries.
            gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > existing-assets.txt
            for asset in release-assets/*; do
              if ! grep -Fxq "$(basename "$asset")" existing-assets.txt; then
                gh release upload "$RELEASE_TAG" "$asset"
              fi
            done
          else
            gh release create "$RELEASE_TAG" release-assets/* --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" --prerelease --notes-file RELEASE_NOTES.md
          fi
  play:
    name: Build Play Bundle
    if: github.event.inputs.play != 'y'
    runs-on: ubuntu-latest
    needs:
      - libcore
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Golang Status
        run: find buildScript libcore/*.sh | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        uses: actions/cache@v4
        with:
          path: |
            app/libs/libcore.aar
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-play-${{ hashFiles('**/*.gradle.kts') }}
      - name: Gradle Build
        env:
          BUILD_PLUGIN: none
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          echo "${{ secrets.RELEASE_KEYSTORE_B64 }}" | base64 -d > release.keystore
          ./run init action gradle
          ./gradlew :app:bundlePlayRelease
          version=$(sed -n 's/^VERSION_NAME=//p' nb4a.properties | tr -d '\r')
          mkdir -p release-bundle
          cp app/build/outputs/bundle/playRelease/*.aab "release-bundle/vload-$version-play.aab"
      - name: Verify signed bundle and native libraries
        run: |
          jarsigner -verify release-bundle/*.aab > bundle-signature.txt
          grep -q 'jar verified.' bundle-signature.txt
          python3 - <<'PY'
          import pathlib, zipfile
          bundle, = pathlib.Path('release-bundle').glob('*.aab')
          with zipfile.ZipFile(bundle) as archive:
              names = set(archive.namelist())
              for abi in ('armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'):
                  assert f'base/lib/{abi}/libgojni.so' in names, f'Missing native library: {abi}'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: AAB
          path: release-bundle/*.aab
          if-no-files-found: error
